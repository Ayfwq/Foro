# 坊市 Foro — 前端托管 + 网关反向代理
# 用法：复制到 nginx 的 conf 目录，把 __FRONT_DIR__ 替换成 front 目录的绝对路径，
#      例如 D:/JavaWebCode/foro/front（Windows 下用正斜杠）。

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # 商城前台
    server {
        listen       18080;
        server_name  localhost;

        location / {
            root   __FRONT_DIR__/portal;
            index  index.html;
            try_files $uri $uri/ =404;
        }

        location /api {
            rewrite /api/(.*)  /$1 break;
            proxy_pass http://localhost:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # 商品与用户管理
    server {
        listen       18081;
        server_name  localhost;

        location / {
            root   __FRONT_DIR__/admin;
            index  items.html index.html;
            try_files $uri $uri/ =404;
        }

        location /api {
            rewrite /api/(.*)  /$1 break;
            proxy_pass http://localhost:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # 运营控制台
    server {
        listen       18082;
        server_name  localhost;

        location / {
            root   __FRONT_DIR__/console;
            index  index.html;
            try_files $uri $uri/ =404;
        }

        location /api {
            rewrite /api/(.*)  /$1 break;
            proxy_pass http://localhost:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
